{% assign bcta = site.data.homepage_2.boxed_cta %}
<!-- Boxed CTA section with dual buttons -->
<section class="boxed-cta section">
  <div class="container">
    <div class="boxed-cta__card">
      <h2 class="boxed-cta__title">{{ bcta.title }}</h2>
      <p class="boxed-cta__lead">{{ bcta.lead }}</p>
      <div class="boxed-cta__actions">
        <a class="cta-btn cta-btn--primary" href="{{ bcta.primary_button.link }}">{{ bcta.primary_button.label }}</a>
        <a class="cta-btn cta-btn--secondary" href="{{ bcta.secondary_button.link }}">{{ bcta.secondary_button.label }}</a>
      </div>
      <p class="boxed-cta__note">{{ bcta.note }}</p>
    </div>
  </div>
</section>
