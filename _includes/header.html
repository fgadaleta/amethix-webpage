<nav class="navbar navbar-expand-lg main-nav" id="main-nav">
	<div class="container">
		<a class="navbar-brand" href="{{site.url}}">
			<img src="{{site.logo_dark | relative_url}}" alt="{{site.title}}" class="img-fluid">
		</a>

		<button class="navbar-toggler collapsed" type="button" data-toggle="collapse" data-target="#navigation"
        aria-controls="navigation" aria-expanded="false" aria-label="Toggle navigation">
        <span class="ti-menu"></span>
	  </button>

		<div class="collapse navbar-collapse" id="navigation">
			{% include navigation.html %}
		</div>

		<button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark mode" title="Toggle theme">
			<svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
			</svg>
			<svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
				<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
			</svg>
		</button>
	</div>
</nav>

<script>
(function(){
  var btn = document.getElementById('theme-toggle');
  if (!btn) return;
  btn.addEventListener('click', function(){
    var html = document.documentElement;
    var next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('amethix-theme', next);
  });
})();
</script>

<style>
/* Sticky navbar animation */
@keyframes stickySlide {
  from { transform: translateY(-10px); opacity: 0; }
  to   { transform: translateY(0);     opacity: 1; }
}
.main-nav { transition: background 300ms ease, box-shadow 300ms ease; }
.main-nav.sticky-animate { animation: stickySlide 250ms ease-out; }

/* Nav accent line at bottom on hover */
#main-nav .navbar-nav .nav-link::after {
  content: '';
  display: block;
  height: 2px;
  width: 0;
  background: linear-gradient(90deg, #7c3aed, #06b6d4);
  transition: width 0.25s ease;
  margin-top: 2px;
}
#main-nav .navbar-nav .nav-link:hover::after,
#main-nav .navbar-nav .active > .nav-link::after {
  width: 100%;
}
</style>

<script>
(function(){
  var nav = document.getElementById('main-nav');
  if (!nav) return;
  var isFixed = false;

  function applySticky(){
    var shouldFix = window.scrollY >= 100;
    if (shouldFix && !isFixed) {
      nav.classList.add('fixed-top');
      nav.classList.add('sticky-animate');
      // Prevent content jump by offsetting body
      document.body.style.paddingTop = nav.offsetHeight + 'px';
      // Remove animation class after it plays
      var handler = function(){
        nav.classList.remove('sticky-animate');
        nav.removeEventListener('animationend', handler);
      };
      nav.addEventListener('animationend', handler);
      isFixed = true;
    } else if (!shouldFix && isFixed) {
      nav.classList.remove('fixed-top');
      document.body.style.paddingTop = '0px';
      isFixed = false;
    }
  }

  // Initialize and bind
  window.addEventListener('scroll', applySticky, { passive: true });
  window.addEventListener('load', applySticky);
})();
</script>
