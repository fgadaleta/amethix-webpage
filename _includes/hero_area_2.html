<!-- Hero Start -->
<section class="page-title" style="overflow: hidden; position: relative; background: #060612;">

  <div class="hero-video-section" style="position: relative;">

    <video
      class="hero-video"
      autoplay
      muted
      loop
      playsinline
      preload="auto"
      style="width:100%; height:auto; display:block;"
    >
      <source src="assets/videos/amethix-intro-video-footage.mp4" type="video/mp4">
    </video>

    <script>
    document.addEventListener("DOMContentLoaded", function () {
      const v = document.querySelector(".hero-video");
      if (!v) return;
      v.muted = true;
      const playAttempt = v.play();
      if (playAttempt !== undefined) {
        playAttempt.catch(() => {
          const tryPlay = () => { v.play(); window.removeEventListener("touchstart", tryPlay); };
          window.addEventListener("touchstart", tryPlay);
        });
      }
    });
    </script>

    <div class="video-overlay-text">
      <p class="hero-eyebrow">Mission-Critical AI Systems</p>
      <h1 class="overlay-main">Software That Doesn't Fail<br>When Failure Costs Lives</h1>
      <p class="hero-sub">Defense &bull; Critical Infrastructure &bull; Advanced AI</p>
      <div class="hero-cta-group">
        <a href="/capabilities" class="primary-rounded-btn">Explore Capabilities <i class="ti-arrow-right"></i></a>
        <a href="/contact" class="secondary-rounded-btn" style="margin-left: 20px;">Talk to us <i class="ti-arrow-right"></i></a>
      </div>
    </div>

  </div>

</section>

<style>
.hero-eyebrow {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgba(216, 180, 254, 1);
  margin-bottom: 20px;
  background: none;
  -webkit-text-fill-color: rgba(216, 180, 254, 1);
  text-shadow: 0 1px 8px rgba(0,0,0,0.5);
}
.hero-sub {
  font-size: 0.9rem;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: rgba(203, 213, 225, 0.95);
  margin-top: 18px;
  background: none;
  -webkit-text-fill-color: rgba(203, 213, 225, 0.95);
  text-shadow: 0 1px 8px rgba(0,0,0,0.5);
}
.hero-cta-group {
  margin-top: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
}
</style>
<!-- Hero End -->
