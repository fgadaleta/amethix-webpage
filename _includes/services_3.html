<!-- Testimonial Start -->
{% assign service = site.data.homepage_2.services %}
{% if service.enable %}
<section class="section testimonial position-relative">
	<div class="h60 bg-testimonial1"></div>
	<div class="container">
		<div class="row">
			<div class="col-lg-12 text-center">
                <h1 class="mb-5 mt-2">{{ service.title }}</h1>
				<span class="h5 text-color text-uppercase">
					{{ service.subtitle }}
				</span>
			</div>
		</div>

		<div class="row testimonial-slider">
			{% for item in service.item %}
			<div class="col-lg-4">

				<div class="card text-center rounded-0 shadow mb-4">
                    <h5 class="mb-0 mt-2">{{ item.name }}</h5>
					{{item.content| markdownify}}

                    {% for box in item.boxes %}
                        <i class="{{box.icon}} text-color"></i>
                        <span class="text-color">{{ box.content }}</span>
                    {% endfor %}

				</div>
			</div>
			{% endfor %}
		</div>
	</div>
</section>
<!-- Testimonial End -->
{% endif %}
